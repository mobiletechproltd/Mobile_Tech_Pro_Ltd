<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Tech Pro Ltd</title>
<meta name="description" content="Mobile Tech Pro Ltd — mobile device repairs & tech support">
<style>
  :root{
    --accent:#2563eb;
    --bg:#ffffff; --bg-alt:#f6f7f9; --text:#1c2230; --muted:#5b6472; --border:#e6e8ec; --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;}
  a{color:inherit;text-decoration:none;}
  .page{max-width:520px;margin:0 auto;padding:0 20px 48px;}

  header{padding:28px 0 4px;text-align:center;}
  .logo-icon{width:56px;height:56px;margin:0 auto 14px;display:block;}
  header h1{font-size:clamp(1.3rem,5vw,1.7rem);font-weight:800;letter-spacing:-0.3px;}
  header p.tagline{color:var(--muted);margin-top:8px;font-size:0.98rem;}

  .list{display:flex;flex-direction:column;gap:10px;margin-top:28px;}
  .row{
    display:flex;align-items:center;gap:14px;width:100%;
    padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);
    background:#fff;cursor:pointer;text-align:left;
    min-height:60px;
    /* reset browser button defaults so <button> rows match <a> rows exactly */
    -webkit-appearance:none;appearance:none;
    font:inherit;font-size:1rem;line-height:1.5;color:var(--text);margin:0;
  }
  .row:active{background:var(--bg-alt);}
  .row-icon{
    width:38px;height:38px;flex-shrink:0;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg-alt);color:var(--accent);
  }
  .row.primary{background:var(--accent);border-color:var(--accent);}
  .row.primary .row-icon{background:rgba(255,255,255,0.18);color:#fff;}
  .row.primary .row-title{color:#fff;}
  .row.primary .row-sub{color:rgba(255,255,255,0.85);}
  .row.primary .row-arrow{color:rgba(255,255,255,0.85);}
  .row-icon svg{width:20px;height:20px;}
  .row-text{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px;}
  .row-title{font-weight:700;font-size:0.98rem;color:var(--text);}
  .row-sub{color:var(--muted);font-size:0.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row-arrow{color:var(--muted);flex-shrink:0;font-size:1.2rem;line-height:1;}

  footer{margin-top:40px;text-align:center;color:var(--muted);font-size:0.78rem;}
</style>
</head>
<body>

<div class="page">

  <header>
    <!-- Universal mobile-repair icon: fixed, does not change with company name -->
    <svg class="logo-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <rect x="13" y="5" width="19" height="34" rx="4" fill="none" stroke="#2563eb" stroke-width="2.4"/>
      <line x1="13" y1="31" x2="32" y2="31" stroke="#2563eb" stroke-width="2.4"/>
      <circle cx="22.5" cy="35" r="1.4" fill="#2563eb"/>
      <circle cx="35" cy="32" r="11" fill="#ffffff" stroke="#2563eb" stroke-width="2.4"/>
      <path d="M31.5 35.5l3-3m0 0a2.6 2.6 0 10-3.6-3.6 2.6 2.6 0 003.6 3.6z" stroke="#2563eb" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1 id="hero-name">Mobile Tech Pro Ltd</h1>
    <p class="tagline" id="hero-tagline">Mobile device repairs &amp; tech support</p>
  </header>

  <div class="list">
    <a href="#" target="_blank" rel="noopener" class="row primary" id="cta-whatsapp">
      <span class="row-icon"><svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 2C8.3 2 2 8.3 2 16c0 2.6.7 5.1 2 7.3L2 30l6.9-1.9c2.1 1.2 4.5 1.8 7.1 1.8 7.7 0 14-6.3 14-14S23.7 2 16 2zm0 25.5c-2.3 0-4.5-.6-6.4-1.8l-.5-.3-4.1 1.1 1.1-4-.3-.5C4.6 20 4 18 4 16 4 9.4 9.4 4 16 4s12 5.4 12 12-5.4 11.5-12 11.5zm6.6-8.6c-.4-.2-2.1-1-2.4-1.2-.3-.1-.6-.2-.8.2s-.9 1.2-1.1 1.4c-.2.2-.4.3-.7.1-.4-.2-1.6-.6-3-1.9-1.1-1-1.9-2.2-2.1-2.6-.2-.4 0-.6.2-.8.2-.2.4-.4.6-.7.2-.2.3-.4.4-.6.1-.3.1-.5 0-.7-.1-.2-.8-2-1.1-2.7-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.6.1-1 .5-.3.4-1.3 1.3-1.3 3.1s1.3 3.6 1.5 3.9c.2.2 2.6 4 6.4 5.5.9.4 1.6.6 2.1.7.9.3 1.7.2 2.3.1.7-.1 2.1-.9 2.4-1.7.3-.8.3-1.5.2-1.7-.1-.1-.3-.2-.7-.4z"/></svg></span>
      <span class="row-text">
        <span class="row-title">Chat on WhatsApp</span>
        <span class="row-sub" id="row-whatsapp-sub"></span>
      </span>
      <span class="row-arrow">&#8250;</span>
    </a>

    <a href="#" class="row" id="cta-email">
      <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18v14H3z"/><path d="M3 6l9 7 9-7"/></svg></span>
      <span class="row-text">
        <span class="row-title">Email Us</span>
        <span class="row-sub" id="row-email-sub"></span>
      </span>
      <span class="row-arrow">&#8250;</span>
    </a>

    <button class="row" onclick="saveContact()" type="button">
      <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
      <span class="row-text">
        <span class="row-title">Save Our Contact</span>
        <span class="row-sub">Add this number to your phone</span>
      </span>
      <span class="row-arrow">&#8250;</span>
    </button>

    <a href="#" target="_blank" rel="noopener" class="row" id="cta-review">
      <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.9 6.6L22 9.3l-5 4.9 1.2 6.9L12 17.8 5.8 21l1.2-6.9-5-4.9 7.1-.7z"/></svg></span>
      <span class="row-text">
        <span class="row-title">Leave a Review</span>
        <span class="row-sub">Find us on Google Maps</span>
      </span>
      <span class="row-arrow">&#8250;</span>
    </a>
  </div>

  <footer>&copy; <span id="year"></span> <span id="footer-name">Mobile Tech Pro Ltd</span>. All rights reserved.</footer>

</div>

<script>
/* ============================================================
   LIVE DATA SOURCE — Google Form "Business Profile"

   This page reads its details from the published CSV of the
   Google Sheet linked to your "Business Profile" form.

   To update the company name, WhatsApp number, email, or
   Google Maps review link: just submit that form again with
   the new details. The newest submission wins, automatically,
   next time the page loads. No file edits, no re-uploading.

   IMPORTANT: fill in EVERY field each time you submit. A field
   left blank falls back to the DEFAULTS below, not to what you
   entered last time.
   ============================================================ */
const SETTINGS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7sFK9zOqlpQF_gP4PrK5oxMeFwFBtLnuSsU0iWiviRjPM0saYBvcFW_-jhloCKyjyn7dowYf9lUJS/pub?gid=23061776&single=true&output=csv";

// Used only if the live sheet can't be reached (offline, Google outage, etc).
const DEFAULTS = {
  companyName: "Mobile Tech Pro Ltd",
  tagline: "Mobile device repairs & tech support",
  whatsapp: "+447344544184",
  email: "mobiletechproltd@gmail.com",
  reviewLink: "https://maps.app.goo.gl/MTwwrvZJNsjKyTPj6?g_st=ic"
};

let CURRENT = Object.assign({}, DEFAULTS);

document.getElementById('year').textContent = new Date().getFullYear();

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function rowsToObjects(rows){
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1)
    .filter(r => r.some(c => (c||'').trim() !== ''))
    .map(r => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = (r[i] || '').trim());
      return obj;
    });
}

function getField(obj, ...candidates){
  const keys = Object.keys(obj);
  for (const cand of candidates){
    const key = keys.find(k => k.toLowerCase().includes(cand.toLowerCase()));
    if (key && obj[key]) return obj[key];
  }
  return '';
}

/* Country code used to repair numbers typed in local format ("07344...").
   44 = UK. Change this if the business ever moves country. */
const DEFAULT_COUNTRY_CODE = '44';

/* WhatsApp needs the full international number with no +, spaces or zeros.
   This accepts "+44 7344 544184", "07344544184" or "447344544184" and
   always produces "447344544184", so a form typo can't break the link. */
function waDigits(number){
  let n = String(number).replace(/[^\d]/g, '');
  if (n.startsWith('00')) n = n.slice(2);            // 0044... -> 44...
  else if (n.startsWith('0')) n = DEFAULT_COUNTRY_CODE + n.slice(1); // 07344... -> 447344...
  return n;
}

/* Displayed as +44 7344 544184 regardless of how it was typed in the form. */
function prettyPhone(number){
  return '+' + waDigits(number);
}

async function loadData(){
  try {
    const res = await fetch(SETTINGS_CSV_URL, {cache: 'no-store'});
    if (!res.ok) throw new Error('Fetch failed: ' + res.status);
    const objs = rowsToObjects(parseCSV(await res.text()));
    if (objs.length){
      const latest = objs[objs.length - 1]; // newest form submission wins
      CURRENT.companyName = getField(latest, 'company name') || CURRENT.companyName;
      CURRENT.tagline     = getField(latest, 'tagline', 'slogan', 'strapline') || CURRENT.tagline;
      CURRENT.whatsapp    = getField(latest, 'whatsapp') || CURRENT.whatsapp;
      CURRENT.email       = getField(latest, 'email') || CURRENT.email;
      CURRENT.reviewLink  = getField(latest, 'review') || CURRENT.reviewLink;
    }
  } catch (err){
    // Silent fallback — visitors still see a fully working page.
    console.warn('Live sheet unavailable, using saved defaults.', err);
  }
  render();
}

function render(){
  const d = CURRENT;
  const waLink = 'https://wa.me/' + waDigits(d.whatsapp);
  const mailLink = 'mailto:' + d.email;
  const reviewLink = d.reviewLink || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(d.companyName));

  document.title = d.companyName;
  document.getElementById('hero-name').textContent = d.companyName;
  document.getElementById('footer-name').textContent = d.companyName;

  const tagEl = document.getElementById('hero-tagline');
  if (d.tagline){ tagEl.textContent = d.tagline; tagEl.style.display = ''; }
  else { tagEl.style.display = 'none'; }

  document.getElementById('cta-whatsapp').href = waLink;
  document.getElementById('cta-email').href = mailLink;
  document.getElementById('cta-review').href = reviewLink;

  document.getElementById('row-whatsapp-sub').textContent = prettyPhone(d.whatsapp);
  document.getElementById('row-email-sub').textContent = d.email;
}

function saveContact(){
  const d = CURRENT;
  const vcard = [
    'BEGIN:VCARD','VERSION:3.0',
    'FN:' + d.companyName,
    'ORG:' + d.companyName,
    'TEL;TYPE=CELL:' + prettyPhone(d.whatsapp),
    'EMAIL:' + d.email,
    'END:VCARD'
  ].join('\r\n');
  const blob = new Blob([vcard], {type: 'text/vcard;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = d.companyName.replace(/[^a-z0-9]+/gi, '-') + '.vcf';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

render();    // show saved details instantly
loadData();  // then refresh from the live sheet
</script>

</body>
</html>
